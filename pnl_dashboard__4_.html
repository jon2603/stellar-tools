<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PnL Dashboard — Stellar Securities</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#8a6a1a;--gold-dim:rgba(138,106,26,.10);--gold-border:rgba(138,106,26,.25);--bg:#f5f3ef;--bg2:#fff;--bg3:#f0ede8;--bg4:#e8e4dc;--text:#1a1812;--text-dim:#5a5650;--text-muted:#9a9690;--green:#276e47;--green-border:rgba(39,110,71,.25);--red:#b83232;--red-border:rgba(184,50,50,.25);--blue:#2a5fa8;--border:rgba(0,0,0,.09);--border-strong:rgba(0,0,0,.15);--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--bg2);border-bottom:1px solid var(--gold-border);padding:12px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--gold);letter-spacing:.08em}
.brand span{color:var(--text-muted);font-size:11px;font-weight:300;margin-left:8px}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);background:var(--bg3);padding:4px 10px;border-radius:10px;border:1px solid var(--border)}
.ubtn{padding:6px 14px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border-radius:var(--radius);transition:background .2s}
.ubtn:hover{background:rgba(138,106,26,.2)}
#fi{display:none}
.pbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 36px;display:flex;gap:6px;align-items:center}
.plbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:600;margin-right:4px}
.pbtn{padding:5px 14px;border:1px solid var(--border-strong);background:var(--bg3);color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;border-radius:20px;transition:all .2s}
.pbtn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);font-weight:600}
.tbar{display:flex;padding:0 36px;background:var(--bg2);border-bottom:2px solid var(--border)}
.tab{padding:10px 24px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}
.main{padding:24px 36px;max-width:1360px;margin:0 auto}
.krow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;border-left:3px solid var(--gold-border)}
.kl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.kv{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.1}
.kv.gold{color:var(--gold)} .kv.green{color:var(--green)} .kv.red{color:var(--red)} .kv.blue{color:var(--blue)}
.ks{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.ch{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct2{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600}
.cbadge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);background:var(--bg3);padding:3px 9px;border-radius:10px}
table.ct{width:100%;border-collapse:collapse}
table.ct th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:8px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);font-weight:600}
table.ct th.r{text-align:right}
table.ct td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px}
table.ct tr:last-of-type td{border-bottom:none}
table.ct tr:hover:not(.tr) td{background:var(--bg3)}
table.ct td.name{color:var(--text-dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ct td.mono{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right}
table.ct td.green{color:var(--green);font-weight:600}
table.ct td.red{color:var(--red)}
table.ct tr.tr td{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--gold);border-top:2px solid var(--gold-border)}
.bw{display:flex;align-items:center;gap:8px}
.bb{flex:1;height:4px;background:var(--bg4);border-radius:2px;min-width:50px}
.bf{height:100%;border-radius:2px;background:var(--gold)}
.chart-area{padding:16px 18px}
.chart-wrap{position:relative;height:210px}
.empty{padding:32px;text-align:center;color:var(--text-muted);font-size:13px}
#dropOverlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;pointer-events:none}
#dropOverlay.show{display:flex}
#dropOverlay::before{content:'';position:absolute;inset:0;background:rgba(245,243,239,.75);backdrop-filter:blur(3px)}
#dropOverlay .drop-inner{position:relative;z-index:1;background:var(--bg2);border:3px dashed var(--gold);border-radius:16px;padding:56px 80px;text-align:center}
.di-icon{font-size:48px;margin-bottom:12px}
.di-text{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--gold)}
.di-sub{font-size:12px;color:var(--text-muted);margin-top:6px}
.mbar-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 36px 10px}
.mbar-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mbar-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:600;font-family:'JetBrains Mono',monospace}
.mbar-nav{background:none;border:1px solid var(--border-strong);color:var(--text-dim);width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:13px;line-height:1;padding:0;transition:all .15s}
.mbar-nav:hover{border-color:var(--gold);color:var(--gold)}
.mbar-year{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--text);min-width:38px;text-align:center}
.mbar-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.mc{border:1px solid var(--border);border-radius:6px;padding:5px 4px 4px;text-align:center;transition:all .15s;position:relative;cursor:default;min-width:0;user-select:none}
.mc.has-data{cursor:pointer}
.mc.has-data:hover{border-color:var(--gold-border);background:var(--gold-dim)}
.mc.is-draft{border-color:var(--gold-border);background:var(--gold-dim);cursor:pointer}
.mc.is-closed{border-color:var(--green-border);background:rgba(39,110,71,.07);cursor:pointer}
.mc.is-closed:hover{background:rgba(39,110,71,.14)}
.mc.is-viewing{box-shadow:0 0 0 2px var(--gold);border-color:var(--gold)}
.mc-q{position:absolute;top:2px;right:3px;font-size:7px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);opacity:.55}
.mc-name{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);line-height:1}
.mc.is-draft .mc-name{color:var(--gold)}
.mc.is-closed .mc-name{color:var(--green)}
.mc-ico{font-size:9px;margin-top:2px;height:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1812;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;max-width:360px}
.toast.show{opacity:1}
</style>
</head>

// STORAGE
// One key per month: stellar_pnl_month_2026_04 = {data, label, closed, closedAt}
// ═══════════════════════════════════════════════════════════════
var LS_PREFIX = 'stellar_pnl_month_';
var LS_SHARED = 'stellar_pnl_v5_imports';

function mKey(y,m){ return LS_PREFIX+y+'_'+String(m).padStart(2,'0'); }
function mToQ(m){ return m<=3?1:m<=6?2:m<=9?3:4; }

function getMonthData(year, month){
  try{ return JSON.parse(localStorage.getItem(mKey(year,month))||'null'); }
  catch(e){ return null; }
}
function setMonthData(year, month, obj){
  try{ localStorage.setItem(mKey(year,month), JSON.stringify(obj)); }
  catch(e){ alert('localStorage plein'); }
}
function getAllMonths(){
  // Returns array of {year,month,label,closed,closedAt,data}
  var result = [];
  for(var i=0; i<localStorage.length; i++){
    var k = localStorage.key(i);
    if(k && k.indexOf(LS_PREFIX)===0){
      try{
        var v = JSON.parse(localStorage.getItem(k));
        if(v) result.push(v);
      }catch(e){}
    }
  }
  return result;
}

function syncShared(){
  var months = getAllMonths();
  var arr = months.map(function(mo){
    return {key:'import_'+mo.year+'_'+String(mo.month).padStart(2,'0'),
            label:mo.label, month:mo.month, year:mo.year,
            quarter:mToQ(mo.month), data:mo.data};
  });
  try{ localStorage.setItem(LS_SHARED, JSON.stringify(arr)); }catch(e){}
}

}

function parseDateFromName(fname){
  var all=[], re=/(\d{8})/g, m;
  while((m=re.exec(fname))!==null){
    var s=m[1], y=parseInt(s.slice(0,4)), mo=parseInt(s.slice(4,6)), d=parseInt(s.slice(6,8));
    if(y>=2020&&y<=2035&&mo>=1&&mo<=12&&d>=1&&d<=31) all.push({y:y,m:mo,d:d});
  }
  if(!all.length) return null;
  var last=all[all.length-1];
  return {year:last.y, month:last.m};
}

// QTD
// ─────────────────────────────────────────────────
function getQTDData(){
  // Use barYear + detect best quarter (where there is data)
  var curY=barYear;
  var curQ=mToQ(new Date().getMonth()+1);
  // If viewing a month in barYear, use its quarter
  if(currentYear===barYear&&currentMonth) curQ=mToQ(currentMonth);
  else{
    // Find latest quarter that has data in barYear
    for(var q=4;q>=1;q--){
      for(var mi=(q-1)*3+1;mi<=q*3;mi++){
        if(getMonthData(barYear,mi)){curQ=q;break;}
      }
      if(getMonthData(barYear,(curQ-1)*3+1)||getMonthData(barYear,(curQ-1)*3+2)||getMonthData(barYear,curQ*3)) break;
    }
  }
  var months=[],qtdG=0,qtdF=0,qtdN=0,cMap={},evo=[],hasData=false;
  for(var m=(curQ-1)*3+1;m<=curQ*3;m++){
    var mo=getMonthData(curY,m);
    var locked=mo?mo.closed:null;
    months.push({month:m,year:curY,label:MONTHS_FR[m-1],locked:locked,data:mo?mo.data:null});
    if(!mo) continue;
    hasData=true;
    var br=mo.data[profile]||{};
    qtdG+=br.mtd_gross||0; qtdF+=br.mtd_fees||0; qtdN+=br.mtd_net||0;
    (br.clients||[]).forEach(function(c){
      if(!cMap[c.client]) cMap[c.client]={client:c.client,qtd_gross:0,qtd_fees:0,qtd_net:0};
      cMap[c.client].qtd_gross+=c.mtd_gross||0;
      cMap[c.client].qtd_fees+=c.mtd_fees||0;
      cMap[c.client].qtd_net+=c.mtd_net||0;
    });
    (br.daily_evolution||[]).forEach(function(d){evo.push({date:d.date,daily:d.daily});});
  }
  evo.sort(function(a,b){return a.date.localeCompare(b.date);});
  var cum=0;
  evo=evo.map(function(d){cum+=d.daily;return{date:d.date,daily:d.daily,cumul:Math.round(cum*100)/100};});
  return{quarter:curQ,year:curY,months:months,gross:qtdG,fees:qtdF,net:qtdN,
    clients:Object.values(cMap).sort(function(a,b){return b.qtd_gross-a.qtd_gross;}),
    allEvolution:evo,hasData:hasData};
}

function handleFilePick(e){ var f=e.target.files[0]; e.target.value=''; if(f) processFile(f); }

function processFile(file){
  if(typeof XLSX==='undefined'){ showToast('Librairies en cours de chargement...'); return; }
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      var ws=wb.Sheets['Daily_Recap'];
      if(!ws){ showToast('Feuille Daily_Recap introuvable'); return; }
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
      var FIVE=['Jonathan Buenavida','Jeremy Cohen','Julien Rouach','Olivier Levy-Bencheton','Uriel Kutnowski'];
      var nb={};
      var sec=-1;
      for(var i=0;i<rows.length;i++){
        if(rows[i]&&rows[i].join&&String(rows[i].join('|')).includes('Estimate Client P&L')){sec=i+3;break;}
      }
      if(sec<0){ showToast('Section Estimate Client P&L introuvable'); return; }
      function pf(v){return(v!==null&&v!==undefined&&!isNaN(parseFloat(v)))?parseFloat(v):0;}
      var cur=null;
      for(var i=sec;i<rows.length;i++){
        var row=rows[i]; if(!row||row[2]==null) continue;
        var raw=String(row[2]),lead=raw.length-raw.trimStart().length,name=raw.trim();
        if(!name||name==='null') continue;
        var dg=pf(row[9]),df=pf(row[16]),dn=pf(row[22]),mg=pf(row[23]),mf=pf(row[25]),mn=pf(row[27]);
        if(lead===0){
          cur=(FIVE.indexOf(name)>=0)?name:null;
          if(cur) nb[cur]={day_gross:dg,day_fees:df,day_net:dn,mtd_gross:mg,mtd_fees:mf,mtd_net:mn,clients:{},daily_evolution:[]};
          continue;
        }
        if(cur&&lead>0){
          var cn=name.split(' - ')[0].trim();
          var cc=nb[cur].clients;
          if(!cc[cn]) cc[cn]={day_gross:0,day_fees:0,day_net:0,mtd_gross:0,mtd_fees:0,mtd_net:0};
          cc[cn].day_gross+=dg; cc[cn].day_fees+=df; cc[cn].day_net+=dn;
          cc[cn].mtd_gross+=mg; cc[cn].mtd_fees+=mf; cc[cn].mtd_net+=mn;
        }
      }
      // Daily evolution
      var ws2=wb.Sheets['Client MTD Summary'];
      var r2=ws2?XLSX.utils.sheet_to_json(ws2,{header:1,defval:''}):[];
      var hm=-1;
      for(var i=0;i<r2.length;i++){
        if(r2[i]&&r2[i].includes('Trade Date')&&r2[i].includes('Brokerage EUR')){hm=i;break;}
      }
      if(hm>=0){
        var h=r2[hm],iTD=h.indexOf('Trade Date'),iRc=h.indexOf('Profit Recipient'),iBr=h.indexOf('Brokerage EUR');
        var ag={};
        for(var i=hm+1;i<r2.length;i++){
          var rr=r2[i],rec=String(rr[iRc]||'').trim(),bro=parseFloat(String(rr[iBr]||'').replace(/,/g,''))||0;
          if(!rec||bro<=0) continue;
          var rd=rr[iTD],ds='';
          if(typeof rd==='number'){
            var dd=XLSX.SSF.parse_date_code(rd);
            ds=dd.y+'-'+String(dd.m).padStart(2,'0')+'-'+String(dd.d).padStart(2,'0');
          } else ds=String(rd).slice(0,10);
          if(!ds||ds.includes('NaN')) continue;
          if(!ag[rec]) ag[rec]={};
          ag[rec][ds]=(ag[rec][ds]||0)+bro;
        }
        FIVE.forEach(function(nm){
          if(!nb[nm]) return;
          var de=ag[nm]||{};
          var sorted=Object.entries(de).sort(function(a,b){return a[0].localeCompare(b[0]);});
          var cu=0;
          nb[nm].daily_evolution=sorted.map(function(x){
            cu+=x[1];return{date:x[0],daily:Math.round(x[1]*100)/100,cumul:Math.round(cu*100)/100};
          });
        });
      }
      FIVE.forEach(function(nm){
        if(!nb[nm]) return;
        nb[nm].clients=Object.entries(nb[nm].clients).map(function(x){
          return{client:x[0],
            day_gross:Math.round(x[1].day_gross*100)/100,day_fees:Math.round(x[1].day_fees*100)/100,day_net:Math.round(x[1].day_net*100)/100,
            mtd_gross:Math.round(x[1].mtd_gross*100)/100,mtd_fees:Math.round(x[1].mtd_fees*100)/100,mtd_net:Math.round(x[1].mtd_net*100)/100};
        }).sort(function(a,b){return b.mtd_gross-a.mtd_gross;});
      });
      // Detect month/year
      var parsed=parseDateFromName(file.name), month, year;
      if(parsed){ month=parsed.month; year=parsed.year; }
      else{
        var sb=Object.values(nb)[0];
        if(sb&&sb.daily_evolution&&sb.daily_evolution.length){
          var d=sb.daily_evolution[0].date; year=parseInt(d.slice(0,4)); month=parseInt(d.slice(5,7));
        } else { var now=new Date(); year=now.getFullYear(); month=now.getMonth()+1; }
      }
      var label=MONTHS_FR[month-1]+' '+year;
      // Check if already closed
      var existing=getMonthData(year,month);
      if(existing&&existing.closed){
        if(!confirm(label+' est cl\u00f4tur\u00e9. Rouvrir et remplacer ?')) return;
      }
      // Save — preserve closed state if user confirmed above
      var wasClosed=existing&&existing.closed;
      setMonthData(year,month,{
        data:nb, label:label, month:month, year:year,
        closed:false, closedAt:null
      });
      DATA=nb;
      currentYear=year; currentMonth=month;
      barYear=year;
      document.getElementById('plbl').textContent=label+' (en cours)';
      syncShared(); renderMonthBar(); updateCloseBtns(); renderAll();
      showToast('\u2713 '+label+' import\u00e9 \u2014 '+Object.values(nb)[0].clients.length+' clients');
    }catch(err){
      showToast('Erreur: '+err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ─────────────────────────────────────────────────
// DRAG & DROP
// ─────────────────────────────────────────────────
function initDragDrop(){
  var overlay=document.getElementById('dropOverlay');
  var depth=0;
  function hasFiles(e){
    if(!e.dataTransfer||!e.dataTransfer.types) return false;
    return Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0;
  }
  document.addEventListener('dragenter',function(e){
    if(!hasFiles(e)) return;
    e.preventDefault(); depth++;
    if(depth===1) overlay.classList.add('show');
  },false);
  document.addEventListener('dragleave',function(e){
    if(!hasFiles(e)) return;
    depth--; if(depth<=0){depth=0; overlay.classList.remove('show');}
  },false);
  document.addEventListener('dragover',function(e){
    if(!hasFiles(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect='copy';
  },false);
  document.addEventListener('drop',function(e){
    e.preventDefault(); depth=0; overlay.classList.remove('show');
    var dt=e.dataTransfer;
    if(!dt||!dt.files||!dt.files.length) return;
    var file=null;
    for(var i=0;i<dt.files.length;i++){
      if(/\.(xls|xlsx)$/i.test(dt.files[i].name)){file=dt.files[i];break;}
    }
    if(!file){ showToast('Fichier .xls ou .xlsx requis'); return; }
    processFile(file);
  },false);
}

// ─────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────
var _tt=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(_tt) clearTimeout(_tt);
  _tt=setTimeout(function(){t.classList.remove('show');},3500);
}

// ─────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────
window.addEventListener('load',function(){
  var libs=[
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];
  var loaded=0;
  libs.forEach(function(src){
    var s=document.createElement('script'); s.src=src;
    s.onload=function(){if(++loaded===libs.length) init();};
    s.onerror=function(){showToast('Erreur chargement librairies');};
    document.head.appendChild(s);
  });
});

function init(){
  // Load the most recent imported month as default view
  var all=getAllMonths();
  if(all.length){
    all.sort(function(a,b){ return (b.year*12+b.month)-(a.year*12+a.month); });
    var latest=all[0];
    DATA=latest.data;
    currentYear=latest.year; currentMonth=latest.month;
    barYear=latest.year;
    document.getElementById('plbl').textContent=latest.label+(latest.closed?' \uD83D\uDD12':'');
    showToast('Restaur\u00e9 : '+latest.label);
  }
  renderMonthBar();
  updateCloseBtns();
  renderAll();
  initDragDrop();
}

</script>
